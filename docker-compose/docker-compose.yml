services:
  dolphindb:
    # 使用 0.0.11 GCC 8 插件，保留官方镜像自带的 C++ 运行库。
    image: dolphindb-caplib:v3.00.5
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DDB_BASE_IMAGE: ${DDB_BASE_IMAGE:-dolphindb/dolphindb:v3.00.5}
    container_name: dolphindb-caplib
    ports:
      - "8848:8848"   # DolphinDB 客户端端口
      - "8900:8900"   # Web/集群端口
    volumes:
      - ${CAPLIB_PLUGIN_DIR:?Set CAPLIB_PLUGIN_DIR to the extracted 0.0.11 plugin directory}:/data/ddb/server/plugins/caplib:ro
      - ./dolphindb.dos:/data/ddb/server/dolphindb.dos   # 启动时自动 loadPlugin
    restart: unless-stopped
